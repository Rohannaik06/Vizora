<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - Vizora</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f1f3f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{

    width:100%;
    max-width:420px;

    background:#fff;

    padding:40px;

    border-radius:12px;

    box-shadow:0 10px 25px rgba(0,0,0,.10);

}

.logo{

    text-align:center;

    margin-bottom:30px;

}

.logo h2{

    font-size:34px;

    color:#2874f0;

}

.logo span{

    color:#ff9800;

}

.logo p{

    color:#666;

    margin-top:8px;

    font-size:14px;

}

.input-group{

    position:relative;

    margin-bottom:20px;

}

.input-group i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#888;

}

.input-group input{

    width:100%;

    padding:12px 15px 12px 42px;

    border:1px solid #ddd;

    border-radius:8px;

    outline:none;

    font-size:15px;

}

.input-group input:focus{

    border-color:#2874f0;

}

.reset-btn{

    width:100%;

    border:none;

    background:#2874f0;

    color:#fff;

    padding:12px;

    border-radius:8px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.reset-btn:hover{

    background:#0d62e6;

}

.footer{

    text-align:center;

    margin-top:20px;

}

.footer a{

    color:#2874f0;

    text-decoration:none;

    font-weight:600;

}

.footer a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">

        <h2>Vizo<span>ra</span></h2>

        <p>Reset your account password</p>

    </div>

    <form
    action="ForgotPasswordServlet"
    method="post"
    id="forgotForm">

        <div class="input-group">

            <i class="fa-solid fa-envelope"></i>

            <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter Registered Email"
            required>

        </div>

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            name="newPassword"
            id="newPassword"
            placeholder="New Password"
            required
            minlength="6">

        </div>

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
            minlength="6">

        </div>

        <button
        type="submit"
        class="reset-btn">

            Reset Password

        </button>

    </form>

    <div class="footer">

        <a href="login.html">

            ← Back to Login

        </a>

    </div>

</div>

<script>

document.getElementById("forgotForm").onsubmit=function(e){

    const pass=document.getElementById("newPassword").value;

    const confirm=document.getElementById("confirmPassword").value;

    if(pass.length<6){

        alert("Password must be at least 6 characters.");

        e.preventDefault();

        return;

    }

    if(pass!==confirm){

        alert("Passwords do not match.");

        e.preventDefault();

        return;

    }

}

</script>

</body>
</html>
