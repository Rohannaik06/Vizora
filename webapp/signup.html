<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Vizora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* CSS in same file */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        .auth-page {
            background: #f1f3f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h2 { font-size: 32px; color: #2874f0; }
        .auth-header span { color: #ff9800; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus { border-color: #2874f0; }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #2874f0;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .auth-btn:hover { background: #0d62e6; }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; }
        .auth-footer a { color: #2874f0; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-header">
        <h2>Vizo<span>ra</span></h2>
        <p>Create your account and start exploring our website</p>
    </div>

    <form action="/VIZORA/SignupServlet" method="POST" id="signupForm">
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" name="full_name" placeholder="Full Name" required 
                minlength="3" 
                oninput="this.value = this.value.replace(/[^A-Za-z ]/g, '')">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" name="mobile" id="mobile" 
                placeholder="10-digit Mobile Number" 
                required 
                pattern="[6-9]{1}[0-9]{9}" 
                maxlength="10"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                name="email"
                id="email"
                placeholder="Email Address"
                required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password" id="password" 
                placeholder="Create Password (min 6 chars)" 
                required 
                minlength="6">
        </div>
        
        <button type="submit" class="auth-btn">Sign Up</button>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>

</body>
<script>
document.getElementById("signupForm").onsubmit = function(e){

    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const emailPattern =
    /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

    if(mobile.length != 10){
        alert("Mobile number must be exactly 10 digits.");
        e.preventDefault();
        return;
    }

    if(!emailPattern.test(email)){
        alert("Please enter a valid email address.");
        e.preventDefault();
        return;
    }

    if(password.length < 6){
        alert("Password must be at least 6 characters.");
        e.preventDefault();
        return;
    }

};
</script>
</html>
